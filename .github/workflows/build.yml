name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: flutter-3.35.4
            flutter-version: "3.35.4"
            patch: false
          - name: flutter-latest
            flutter-version: ""
            patch: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter-version }}
          cache: true

      - name: Extract source zip (agar repo me sirf zip hai)
        run: |
          Z=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$Z" ] && [ ! -f pubspec.yaml ]; then unzip -q -o "$Z" -d src_extracted; fi

      - name: Find Flutter project folder
        id: proj
        run: |
          P=$(find . -maxdepth 3 -name pubspec.yaml -not -path "*/.*" | head -n 1)
          if [ -z "$P" ]; then echo "pubspec.yaml nahi mili. Repo ki files:"; ls -R | head -50; exit 1; fi
          DIR=$(dirname "$P")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Project folder: $DIR"

      - name: Clean machine-specific files
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          rm -f android/local.properties
          rm -rf android/.gradle android/.kotlin

      - name: Make sure Android scaffold exists
        id: scaffold
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          if [ -f android/build.gradle ] || [ -f android/build.gradle.kts ]; then
            echo "Android project theek hai"
            echo "regen=false" >> "$GITHUB_OUTPUT"
          else
            echo "Android project adhoora/missing hai, naya bana raha hoon"
            NAME=$(grep -m1 '^name:' pubspec.yaml | awk '{print $2}')
            APPID=$(grep -rhoE 'applicationId[ =]+"[^"]+"' android/app/build.gradle* 2>/dev/null | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
            mkdir -p /tmp/gen
            flutter create --platforms=android --project-name "$NAME" --org com.ludorush /tmp/gen/app
            [ -d android ] && mv android android_old
            cp -r /tmp/gen/app/android ./android
            if [ -d android_old/app/src/main/res ]; then cp -r android_old/app/src/main/res/. android/app/src/main/res/; fi
            if [ -n "$APPID" ]; then
              sed -i -E "s/applicationId = \"[^\"]+\"/applicationId = \"$APPID\"/" android/app/build.gradle.kts || true
              sed -i -E "s/applicationId \"[^\"]+\"/applicationId \"$APPID\"/" android/app/build.gradle || true
              echo "applicationId: $APPID"
            fi
            echo "regen=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update Gradle and Android Gradle Plugin (latest build only)
        if: ${{ matrix.patch && steps.scaffold.outputs.regen != 'true' }}
        working-directory: ${{ steps.proj.outputs.dir }}/android
        run: |
          sed -i 's#gradle-[0-9.]*-all.zip#gradle-8.14.3-all.zip#; s#gradle-[0-9.]*-bin.zip#gradle-8.14.3-bin.zip#' gradle/wrapper/gradle-wrapper.properties
          sed -i 's#id("com.android.application") version "[0-9.]*"#id("com.android.application") version "8.11.1"#' settings.gradle.kts || true
          grep -n "distributionUrl" gradle/wrapper/gradle-wrapper.properties || true

      - name: Restore signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/release-key.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=release-key.jks\n' "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
            echo "Signed release build"
          else
            echo "Secrets nahi mile, debug-key se sign hogi"
          fi

      - name: flutter pub get (lock file ki dikkat ho toh dobara try)
        working-directory: ${{ steps.proj.outputs.dir }}
        run: flutter pub get || (rm -f pubspec.lock && flutter pub get)

      - run: flutter build apk --release
        working-directory: ${{ steps.proj.outputs.dir }}

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.name }}
          path: ${{ steps.proj.outputs.dir }}/build/app/outputs/flutter-apk/app-release.apk
