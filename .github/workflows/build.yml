name: Build Voice Assistant APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: flutter-3.35.4
            flutter-version: "3.35.4"
          - name: flutter-latest
            flutter-version: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter-version }}
          cache: true

      - name: Extract source zip (agar repo me sirf zip hai)
        run: |
          Z=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$Z" ] && [ ! -f pubspec.yaml ]; then unzip -q -o "$Z" -d src_extracted; fi

      - name: Find Flutter project folder
        id: proj
        run: |
          P=$(find . -maxdepth 3 -name pubspec.yaml -not -path "*/.*" | head -n 1)
          if [ -z "$P" ]; then echo "pubspec.yaml nahi mili. Repo ki files:"; ls -R | head -50; exit 1; fi
          DIR=$(dirname "$P")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Project folder: $DIR"

      - name: Use maintained Vosk fork
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          if grep -qE '^\s*vosk_flutter(_service)?:' pubspec.yaml; then
            sed -i -E 's/^(\s*)vosk_flutter(_service)?:.*/\1vosk_flutter_service: ^0.1.0/' pubspec.yaml
            grep -rlE "package:vosk_flutter(_service)?/vosk_flutter(_service)?\.dart" lib | xargs -r sed -i -E "s#package:vosk_flutter(_service)?/vosk_flutter(_service)?\.dart#package:vosk_flutter_service/vosk_flutter_service.dart#"
            rm -f pubspec.lock
            echo "Using vosk_flutter_service"
          else
            echo "Vosk use nahi hota"
          fi

      - name: Make sure Android scaffold exists
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          rm -f android/local.properties
          rm -rf android/.gradle android/.kotlin
          if [ ! -f android/build.gradle ] && [ ! -f android/build.gradle.kts ]; then
            echo "Android project missing, Flutter se bana raha hoon"
            NAME=$(grep -m1 '^name:' pubspec.yaml | awk '{print $2}')
            mkdir -p /tmp/gen
            flutter create --platforms=android --project-name "$NAME" --org com.myassistant /tmp/gen/app
            rm -rf android
            cp -r /tmp/gen/app/android ./android
          fi

      - name: Patch AndroidManifest, proguard (JNA/AWT), and disable R8 minify
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          python3 - <<'PY'
          import re, os

          # --- AndroidManifest ---
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          perms = ('\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>'
                   '\n    <uses-permission android:name="com.android.alarm.permission.SET_ALARM"/>')
          if "RECORD_AUDIO" not in s:
              s = re.sub(r"(<manifest[^>]*>)", lambda m: m.group(1) + perms, s, count=1)
          q = ('\n        <intent><action android:name="android.intent.action.TTS_SERVICE"/></intent>'
               '\n        <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent>'
               '\n        <intent><action android:name="android.intent.action.DIAL"/></intent>\n')
          if "TTS_SERVICE" not in s:
              if "</queries>" in s:
                  s = s.replace("</queries>", q + "    </queries>", 1)
              else:
                  s = s.replace("</manifest>", "    <queries>" + q + "    </queries>\n</manifest>", 1)
          s = re.sub(r'android:label="[^"]*"', 'android:label="Voice Assistant"', s, count=1)
          open(p, "w", encoding="utf-8").write(s)

          # --- ProGuard rules for JNA / missing AWT on Android ---
          rules = """# JNA / Vosk – Android has no java.awt.*
-dontwarn java.awt.**
-dontwarn javax.swing.**
-dontwarn com.sun.jna.**
-keep class com.sun.jna.** { *; }
-keep class * implements com.sun.jna.** { *; }
-keepclassmembers class * extends com.sun.jna.** { public *; }
-keep class org.vosk.** { *; }
"""
          os.makedirs("android/app", exist_ok=True)
          open("android/app/proguard-rules.pro", "w", encoding="utf-8").write(rules)

          # --- Disable minify/shrink so R8 does not fail on missing AWT ---
          for gradle in ("android/app/build.gradle", "android/app/build.gradle.kts"):
              if not os.path.isfile(gradle):
                  continue
              g = open(gradle, encoding="utf-8").read()
              if gradle.endswith(".kts"):
                  g = re.sub(r"isMinifyEnabled\s*=\s*true", "isMinifyEnabled = false", g)
                  g = re.sub(r"isShrinkResources\s*=\s*true", "isShrinkResources = false", g)
                  if "isMinifyEnabled" not in g and "release" in g:
                      g = re.sub(
                          r"(release\s*\{)",
                          r"\1\n            isMinifyEnabled = false\n            isShrinkResources = false",
                          g,
                          count=1,
                      )
              else:
                  g = re.sub(r"minifyEnabled\s+true", "minifyEnabled false", g)
                  g = re.sub(r"shrinkResources\s+true", "shrinkResources false", g)
                  if "minifyEnabled" not in g and "release" in g:
                      g = re.sub(
                          r"(release\s*\{)",
                          r"\1\n            minifyEnabled false\n            shrinkResources false",
                          g,
                          count=1,
                      )
              open(gradle, "w", encoding="utf-8").write(g)
              print("patched", gradle)

          print("manifest + proguard + minify patched")
          PY

      - name: Gradle namespace fix for old plugins
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/namespace-fix.gradle <<'EOG'
          allprojects { p ->
            p.plugins.withId('com.android.library') {
              def ext = p.extensions.findByName('android')
              if (ext != null && ext.namespace == null) {
                def pkg = null
                try {
                  def mf = p.file('src/main/AndroidManifest.xml')
                  if (mf.exists()) { pkg = new XmlSlurper().parse(mf).@package.text() }
                } catch (Exception e) { }
                if (!pkg) { pkg = 'plugin.' + p.name.replaceAll('[^A-Za-z0-9_]', '_') }
                ext.namespace = pkg
              }
            }
          }
          EOG

      - name: Download offline speech models (Hindi + Indian English, small)
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          if grep -q vosk_flutter pubspec.yaml; then
            mkdir -p assets/models
            curl -L --fail -o assets/models/vosk-model-small-hi-0.22.zip https://alphacephei.com/vosk/models/vosk-model-small-hi-0.22.zip
            curl -L --fail -o assets/models/vosk-model-small-en-in-0.4.zip https://alphacephei.com/vosk/models/vosk-model-small-en-in-0.4.zip
            ls -la assets/models
          fi

      - name: flutter pub get
        working-directory: ${{ steps.proj.outputs.dir }}
        run: flutter pub get || (rm -f pubspec.lock && flutter pub get)

      - name: Fix Vosk import to the real library file
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          if grep -q vosk_flutter_service pubspec.yaml; then
            python3 - <<'PY'
          import glob, json, os, re
          cfg = json.load(open(".dart_tool/package_config.json"))
          pkg = [p for p in cfg["packages"] if p["name"] == "vosk_flutter_service"][0]
          root = pkg["rootUri"]
          path = root[len("file://"):] if root.startswith("file://") else os.path.normpath(os.path.join(".dart_tool", root))
          lib = os.path.join(path, pkg.get("packageUri", "lib/"))
          files = sorted(f for f in os.listdir(lib) if f.endswith(".dart"))
          print("library files:", files)
          pick = next((n for n in ("vosk_flutter_service.dart", "vosk_flutter.dart") if n in files), files[0])
          print("using:", pick)
          for f in glob.glob("lib/**/*.dart", recursive=True):
              s = open(f, encoding="utf-8").read()
              n = re.sub(r"package:vosk_flutter(_service)?/[a-z_]+\.dart", "package:vosk_flutter_service/" + pick, s)
              if n != s:
                  open(f, "w", encoding="utf-8").write(n)
                  print("fixed import in", f)
          PY
          fi

      - name: Build release APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: flutter build apk --release --no-shrink

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.name }}
          path: ${{ steps.proj.outputs.dir }}/build/app/outputs/flutter-apk/app-release.apk
