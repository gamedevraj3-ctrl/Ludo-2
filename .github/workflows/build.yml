name: Build Voice Assistant APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.4"
          channel: stable
          cache: true

      - name: Extract source zip (agar repo me sirf zip hai)
        run: |
          Z=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$Z" ] && [ ! -f pubspec.yaml ]; then unzip -q -o "$Z" -d src_extracted; fi

      - name: Find Flutter project folder
        id: proj
        run: |
          P=$(find . -maxdepth 3 -name pubspec.yaml -not -path "*/.*" | head -n 1)
          if [ -z "$P" ]; then echo "pubspec.yaml nahi mili. Repo ki files:"; ls -R | head -50; exit 1; fi
          DIR=$(dirname "$P")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Project folder: $DIR"

      # Android ka scaffold Flutter khud banata hai, isliye Gradle versions ki tension nahi.
      - name: Generate android project and patch it
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name voice_assistant --org com.myassistant _gen
            cp -r _gen/android ./android
            rm -rf _gen
          fi
          python3 tools/patch_android.py .

      - name: Download offline speech models (Hindi + Indian English, small)
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          mkdir -p assets/models
          curl -L --fail -o assets/models/vosk-model-small-hi-0.22.zip https://alphacephei.com/vosk/models/vosk-model-small-hi-0.22.zip
          curl -L --fail -o assets/models/vosk-model-small-en-in-0.4.zip https://alphacephei.com/vosk/models/vosk-model-small-en-in-0.4.zip
          ls -la assets/models

      # Purane plugins me kabhi namespace nahi hota (AGP 8 error deta hai), ye usse bacha leta hai.
      - name: Gradle namespace safety net
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/namespace-fix.gradle <<'EOG'
          allprojects {
            afterEvaluate { p ->
              if (p.hasProperty('android') && p.android.hasProperty('namespace') && p.android.namespace == null) {
                def pkg = null
                try {
                  def mf = p.android.sourceSets.main.manifest.srcFile
                  if (mf.exists()) { pkg = new XmlSlurper().parse(mf).@package.text() }
                } catch (Exception e) { }
                if (!pkg) { pkg = p.group.toString() }
                p.android.namespace = pkg
              }
            }
          }
          EOG

      - run: flutter pub get
        working-directory: ${{ steps.proj.outputs.dir }}

      - run: flutter build apk --release --no-shrink
        working-directory: ${{ steps.proj.outputs.dir }}

      - uses: actions/upload-artifact@v4
        with:
          name: voice-assistant-apk
          path: ${{ steps.proj.outputs.dir }}/build/app/outputs/flutter-apk/app-release.apk
